services:
  api:
    build:
      context: ./services/api
    ports:
      - "3001:3001"
    environment:
      - API_PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
